name: Validate Kubernetes manifests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate-k8s:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests (offline schema check, no cluster needed)
        run: find k8s -name '*.yaml' -print0 | xargs -0 kubeconform -strict -summary

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Validate docker-compose.yaml
        env:
          OLLAMA_PORT: "11434"
          WEBUI_PORT: "3000"
        run: docker compose -f docker-compose.yaml config -q
