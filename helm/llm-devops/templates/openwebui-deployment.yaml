apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: {{ .Values.namespace }}
  labels:
    app: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: {{ .Values.openwebui.image }}
          imagePullPolicy: {{ .Values.openwebui.imagePullPolicy }}
          resources:
            {{- toYaml .Values.openwebui.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: projet-devops-config
          ports:
            - containerPort: {{ .Values.openwebui.containerPort }}
          volumeMounts:
            - name: open-webui-data
              mountPath: /app/backend/data
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.openwebui.containerPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.openwebui.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.openwebui.containerPort }}
            failureThreshold: 30
            periodSeconds: 10
      volumes:
        - name: open-webui-data
          persistentVolumeClaim:
            claimName: open-webui-pvc
